volumes:
  ui:
  zed_resources:

services:
  backend:
    build:
      context: ./services/backend/
      dockerfile: ./Dockerfile
    command: ros2 launch cart_launch autonomous_launcher.launch.py #can be overriden with $BACKEND_COMMAND
    environment:
      - BACKEND_COMMAND #will override the default command above
      - CART_ID=${CART_ID:-james}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - $HOME/.ssh:/root/.ssh
      - $HOME/.gitconfig:/root/.gitconfig
      - DISPLAY
      - XDG_RUNTIME_DIR
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $HOME/.Xauthority:/root/.Xauthority
      - /dev:/dev
      - zed_resources:/usr/local/zed/resources
      - /usr/local/zed/settings:/usr/local/zed/settings
      - type: bind
        source: $HOME/dev_ws
        target: /root/dev_ws
    privileged: true
    runtime: nvidia
    network_mode: "host"
  frontend:
    build:
      context: ./services/frontend/
      dockerfile: ./Dockerfile
    working_dir: /root/ui
    command: npm run dev
    environment:
      - FRONTEND_COMMAND #will override the default command above
      - VITE_CART_NAME=${VITE_CART_NAME}
      - VITE_DASHBOARD_API_ROOT=${VITE_DASHBOARD_API_ROOT}
      - $HOME/.gitconfig:/root/.gitconfig
    network_mode: "host"
    volumes:
      - $HOME/.ssh:/root/.ssh
      - type: bind
        source: $HOME/ui
        target: /root/ui
      - ui:/root/ui/node_modules
  anomaly_detection:
    build:
      context: ./services/anomaly_detection
      dockerfile: ./Dockerfile
    command: ros2 run anomaly_detection bag_recorder_ui_node
    environment:
      - BAG_RECORD_TOPICS=${BAG_RECORD_TOPICS}
      - ANOMALY_AUTOSTART=${ANOMALY_AUTOSTART:-true}
      - ANOMALY_DETECTION_COMMAND # allows for default command override from entrypoint.sh
      - CART_ID=${CART_ID:-james}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_BAG_LOOP=${ROS_BAG_LOOP:-true}
      - ROS_BAG_RATE=${ROS_BAG_RATE:-1.0}
    volumes:
      - type: bind
        source: $HOME/dev_ws
        target: /root/dev_ws
    privileged: true
    runtime: nvidia
    network_mode: "host"
    ipc: "host"
